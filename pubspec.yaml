name: ultrapos
description: UltraPOS - Punto de venta de escritorio (Windows) offline-first con sincronización en la nube.
publish_to: "none"
version: 1.0.0+1

# ---------------------------------------------------------------------------
# Entorno
# Dart 3.9+ permite compilar con Flutter 3.35 en adelante.
# Probado contra Flutter 3.47.x / Dart 3.13.x (última estable a la fecha).
# ---------------------------------------------------------------------------
environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # --- Gestión de estado / DI -----------------------------------------------
  # Riverpod 3.x: Notifier/AsyncNotifier + providers compilados sin codegen.
  flutter_riverpod: ^3.0.0

  # --- Persistencia local (SQLite + Drift) -----------------------------------
  # Drift ofrece type-safety, migraciones versionadas y streams reactivos.
  drift: ^2.30.0
  # SQLite nativo empaquetado para Windows (x64/arm64).
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # --- Sincronización --------------------------------------------------------
  connectivity_plus: ^7.0.0
  http: ^1.2.0
  # Backend opcional. Ver docs/SYNC_ENGINE.md para la variante 100% HTTP.
  supabase_flutter: ^2.18.0

  # --- Hardware / impresión --------------------------------------------------
  # Genera los bytes ESC/POS (la transmisión la implementa UltraPOS).
  esc_pos_utils_plus: ^2.0.4
  # Ticket PDF (respaldo universal + reportes).
  pdf: ^3.11.0
  printing: ^5.13.0

  # --- Seguridad -------------------------------------------------------------
  crypto: ^3.0.3
  flutter_secure_storage: ^9.2.0

  # --- Escritorio / UI / utilidades -----------------------------------------
  window_manager: ^0.5.0
  file_selector: ^1.0.3
  # `intl: any` es la recomendación oficial para no pelear con
  # flutter_localizations por la versión.
  intl: any
  uuid: ^4.5.0
  collection: ^1.19.0
  # FFI para impresión RAW (winspool.drv) y puertos COM (kernel32.dll).
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  drift_dev: ^2.30.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/

  # ---------------------------------------------------------------------------
  # Tipografía Inter (opcional, recomendada).
  # UltraPOS funciona sin estos archivos: app_typography.dart cae a
  # "Segoe UI Variable"/"Segoe UI" (la fuente nativa de Windows).
  # Para empaquetar Inter:
  #   1) Descarga Inter-Regular.ttf / Inter-Medium.ttf / Inter-SemiBold.ttf /
  #      Inter-Bold.ttf desde https://github.com/rsms/inter/releases
  #   2) Guárdalos en assets/fonts/
  #   3) Descomenta este bloque y vuelve a ejecutar `flutter pub get`
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
